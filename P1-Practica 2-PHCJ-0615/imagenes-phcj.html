<!DOCTYPE html> <!-- Le dice al navegador que muestre la página usando HTML5 estándar y evita errores de formato -->
<html lang="en"> <!-- Indica que el idioma principal es el inglés -->
<head> <!-- Guarda metadatos y configuración que no se ve en la pantalla -->
    <meta charset="UTF-8"> <!-- Traducir el código para mostrar acentos, la ñ y emojis -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Adaptar sitios a teléfonos y evitar que se vean diminutos como en una PC-->
    <title>Imagenes en HTML</title> <!-- Título que aparece en la pestaña del navegador -->
</head>
<body> <!-- El cuerpo del documento -->
    <h2>Imagenes en HTML</h2> <!-- Titulo un poco menos grande e importante -->
    <h3>Locales</h3> <!-- Titulo menos importante -->
    <img src="caritas.png" alt="Imagen de carita feliz"> <!-- 'img':inserta una imagen, 'src':indica dónde está el archivo, 'alt':texto si la imagen falla -->
    <h3>Locales redismensionado</h3>
    <img src="imagenes/carita.png" alt="" width="200" height="100"> <!--'imagenes/carita.png': busca la imagen dentro de la carpeta 'imagenes', 'width' y 
    'height': cambian el ancho y alto -->
    <h3>Desde internet</h3>
    <img src="https://st2.depositphotos.com/2172759/11751/v/950/depositphotos_117511772-stock-illustration-happy-face-isolated-on-white.jpg" 
    width="200" height="200" alt=""> <!-- Inserta una imagen directamente desde una dirección web (URL) definiendo su tamaño -->
    <h3>Animaciones</h3>
    <img src="https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExejMydmVybzBiY3lkdWd1Nnp1MzJiMXA3Ymt3czE3NGp1NDZuZDg5YiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/tXL4FHPSnVJ0A/giphy.gif" 
    width="200" height="200" alt=""> <!-- Usa la misma etiqueta 'img' pero con un enlace a un archivo .gif para mostrar imágenes con movimiento -->
</body>
</html> <!-- Cierra el documento HTML completo -->
