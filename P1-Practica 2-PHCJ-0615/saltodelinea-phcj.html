<!DOCTYPE html> <!-- Le dice al navegador que muestre la página usando HTML5 estándar y evita errores de formato -->
<html lang="en"> <!-- Indica que el idioma principal es el inglés -->

<head> <!-- Guarda metadatos y configuración que no se ve en la pantalla -->
    <meta charset="UTF-8"> <!-- Traducir el código para mostrar acentos, la ñ y emojis -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Adaptar sitios a teléfonos y evitar que se vean diminutos como en una PC -->
    <title>Salto de linea en HTML</title> <!-- Título que aparece en la pestaña del navegador -->
</head>
<body> <!-- El cuerpo del documento -->
    <h1>Lenguaje de programacion</h1> <!-- El titulo mas grande e importante -->
    <p>En la actualidad se utilizan diferentes lenguajes de programacion tanto para desarrollo web, desarrollo movil, entranamiento de inteligencia 
        artificial, pero de los mas usados son los siguientes:<br> <!-- Salto de linea: Salta al siguiente renglon -->
        Dart<br> <!-- Mueve el texto siguiente a la línea de abajo sin crear un nuevo párrafo -->
        Flutter<br>
        Python<br>
        Ruby<br>
        Java<br>
        TypeScript<br>
        Entre otros.
    </p>
</body>
</html> <!-- Cierra el documento HTML completo -->
