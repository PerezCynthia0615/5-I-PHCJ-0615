<html> <!--Contenedor del documento html-->
    <head> <!--Guarda metadatos y configuracion que no se ve en la pantalla-->
        <title>Pagina WEB de ejemplo: texto</title> <!--El title= es el titulo que aparece en la pestaña del navegador-->
    </head> <!--Cierra el head-->
    <body text="orange"> <!--Es el cuerpo de la pagina donde aparece toda la informacion visible--> 
        <b>Esta es una linea</b>, y a continuacion <b><u>insertamos un salto</u></b> de linea.<br/>
        Esta es una linea, y 
        <p>Este es un parrafo <font color="cyan">con <u>la letra</u> en <b>diferentes formatos<b/>
    </body> <!--Cierra el cuerpo de la pagina donde aparece toda la informacion visible--> 
</html> <!--Cierra el contenedor del documento html-->
