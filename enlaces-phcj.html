<!DOCTYPE html> <!-- Le dice al navegador que muestre la página usando HTML5 estándar y evita errores de formato -->
<html lang="en"> <!-- Indica que el idioma principal es el inglés -->
<head> <!-- Guarda metadatos y configuración que no se ve en la pantalla -->
    <meta charset="UTF-8"> <!-- Traducir el código para mostrar acentos, la ñ y emojis -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Adaptar sitios teléfonos y evitar que se vean diminutos como en una PC-->
    <title>Enlaces en HTML</title> <!-- Título que aparece en la pestaña del navegador-->
</head>
<body> <!-- El cuerpo del documento -->
    <h2>Tipos de enlaces en HTML</h2> <!-- Titulo un poco menos grande e importante -->
    <p><strong>Enlaces/Hipervinculos a otra pagina del mismo sitio.</strong></p> <!-- Párrafo marcado en negrita -->
    <a href="1. Hola_mundo.html">1. Hola Mundo</a><br> <!--'a': crea un enlace, 'href': indica el archivo local a abrir, '<br>': hace un salto de línea -->
    <a href="2. Encabezados.html" target="_self"> 2. Encabezados</a><br> <!-- 'target="_self"': abre el enlace en la misma pestaña -->
    <a href="3. Parrafos.html" target="_blank"> 3. Parrafos</a><br><!-- 'target="_blank"': abre el enlace en una nueva pestaña o ventana -->
    <a href="4. Salto de linea.html" target="_parent"> 4. Salto de linea</a><br> <!-- 'target="_parent"': abre el enlace en el marco (frame) padre; si no hay
     marcos, abre en la misma pestaña -->
    <a href="5. Enfatizado.html" target="_top"> 5. Enfatizado</a><br> <!-- 'target="_top"': abre el enlace ocupando todo el cuerpo de la ventana, cancelando
     cualquier marco actual -->
    <p><strong>Enlaces/Hipervinculos a sitios externos</strong></p>
    <a href="https://www.google.com/">Google</a><br> <!-- 'href': utiliza una URL completa (http/https) para redirigir a un sitio web externo -->
    <a href="https://www.youtube.com/" target="_self"> YouTube</a><br><!-- Enlace externo que abre en la misma pestaña actual -->
    <a href="https://www.facebook.com/" target="_blank"> FaceBook</a><br><!--Enlace externo que abre en una pestaña nueva (recomendado para sitios externos)-->
    <a href="https://www.wikipedia.com/" target="_parent"> WikiPedia</a><br><!-- Enlace externo configurado con marco padre -->
    <a href="https://www.espanol.yahoo.com/" target="_top">  Yahoo!</a><br> <!-- Enlace externo configurado para romper marcos y abrir arriba del todo -->
</body>
</html> <!-- Cierra el documento HTML completo -->
