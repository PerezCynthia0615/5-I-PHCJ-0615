<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formularios en HTML</title>
<!-- Libreria de iconos en linea -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
</head>
<body>
<h2>Formulario con campos ocultos</h2>
<form action="" method="post"> <!--'action=""': Indica la URL a la que se enviarán los datos. - 'method= "post"': Método 
de envío HTTP que transmite la información de manera privada dentro de la petición. -->
<input type="hidden" name="hora" value="3:30"> <!-- Campo de entrada oculto. - 'type="hidden"': Es invisible para el 
usuario en la interfaz pero envía datos de forma automática al procesar el formulario. - 'name="hora"': Identificador de
la variable en el servidor. - 'value="3:30"': Valor fijo o predeterminado que se transmite internamente. -->
Ingresa tu nombre:
<input type="text" name="nombre"><br><!-- Botón para enviar el formulario con un icono -->
<button type="submit">Enviar <i class="fa-regular fa-paper-plane"></i> </button>
<button type="reset">Borrar <i class="fa fa-trash"></i></button>
</form>
</body>
</html>
