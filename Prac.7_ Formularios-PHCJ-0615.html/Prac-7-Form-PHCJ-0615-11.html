<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formularios en HTML</title>
<!-- Libreria de iconos en linea -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
</head>
<body>
<h2>Formulario con limitaciones</h2>
<form action="" method="post"> Ingresa tu nombre:
<!-- Desahbilitacion de campo -->
<!-- Atributo 'disabled': Desactiva por completo el campo.
El usuario no puede escribir ni interactuar con él, y su valor NO se enviará al servidor al procesar el formulario. -->
<input type="text" name="nombre" disabled><br> Contraseña:
<input type="password" name="pass" maxlength="5"><br> <!-- Atributo 'maxlength="5"': Define el límite máximo de 
caracteres permitidos. El navegador no permitirá escribir más de 5 letras/números en esta casilla. -->
Comentarios:
<!-- Atributo 'readonly': Hace que el contenido del área de texto sea de solo lectura.
El usuario puede seleccionar o copiar el texto, y su valor SÍ se enviará al servidor, pero no se puede editar ni borrar. -->
<textarea name="comentarios" readonly> Este es mi comentario y no se puede borrar
</textarea><br>
</form>
</body>
</html>
