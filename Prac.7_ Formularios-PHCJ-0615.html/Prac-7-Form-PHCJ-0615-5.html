<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formularios en HTML/PHCJ/0615</title>
<!-- Libreria de iconos en linea -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
</head>
<body>
<h2>Formularios con Radioboton | Perez Hinostroza Cynthia Jacqueline</h2>
<form action="" method="post"> <!--'action=""': Indica la URL a la que se enviarán los datos. - 'method= "post"': Método 
de envío HTTP que transmite la información de manera privada dentro de la petición. --> Ingresa tu nombre:
<input type="text" name="nombre"><br> <!-- 'type="text"': Define una casilla para introducir texto.- 'name="
nombre"': Nombre con el que se enviará la variable al servidor. -->
Selecciona el maximo de estudios que tienes:<br> 
<!-- 'type="radio"': Para UNA opción.- 'name="estudios"': Por el mismo nombre, HTML los agrupa para que solo se pueda 
seleccionar uno. - 'value="..."': Define el valor o código que se enviará al servidor cuando la opción sea marcada. -->
<input type="radio" name="estudios" value="1">Sin estudios <br>
<input type="radio" name="estudios" value="2">Primaria <br>
<input type="radio" name="estudios" value="3">Secundaria <br>
<input type="radio" name="estudios" value="4">Preparatoria <br>
<input type="submit" value="enviar"> <input type="reset" value="borrar">
</form>
</body>
</html>
