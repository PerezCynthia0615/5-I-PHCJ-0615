<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formularios en HTML</title>
<!-- Libreria de iconos en linea -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
</head>
<body>
<h2>Formularios con agrupamiento</h2>
<form action="" method="post">
<fieldset><!--Agrupa visualmente un conjunto de campos relacionados dibujando un recuadro a su alrededor -->
<!-- Título para el grupo delimitado por el <fieldset> -->
<legend>Datos personales</legend>
Nombre y apellido:<input type="text" name="nombre_apellido"><br>
Documento valido:<input type="file" name="documento"><br>
Fecha de nacimiento: <input type="date" name="fecha_nacimiento"></fieldset><!-- Campo de entrada para selección de fechas
- 'type="date"': Despliega un calendario interactivo nativo del navegador para elegir año, mes y día. - 'name="
fecha_nacimiento"': Identificador de la fecha seleccionada en el servidor. -->
<fieldset> <legend>Datos de estudio:</legend>
Nombre de la escuela:<input type="text" name="escuela"><br>
Certificado valido:<input type="file" name="certificado"><br>
Fecha de egreso:<input type="date" name="fecha_egreso"> <!-- Calendario interactivo para la fecha de egreso -->
</fieldset><br>
<button type="submit">Enviar <i class="fa-regular fa-paper-plane"></i> </button>
<button type="reset">Borrar <i class="fa fa-trash"></i></button>
</form>
</body>
</html>
