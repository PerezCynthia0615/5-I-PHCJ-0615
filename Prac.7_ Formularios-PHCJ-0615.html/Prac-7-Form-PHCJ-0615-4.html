<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<title>Formularios en HTML/PHCJ/0615</title> 
<!-- Libreria de iconos en linea -->

</head>
<body> 
<h2>Formularios con checkbox | Perez Hinostroza Cynthia Jacqueline</h2>
<form action="" method="post"> <!--'action=""': Indica la URL a la que se enviarán los datos. - 'method= "post"': Método 
de envío HTTP que transmite la información de manera privada dentro de la petición. -->
Ingresa tu nombre: <!-- Texto para la casilla -->
<input type="text" name="nombre"><br> <!-- 'type="text"': Define una casilla para introducir texto.- 'name="
nombre"': Nombre con el que se enviará la variable al servidor. -->
Selecciona los lenguajes que conozcas:<br>
<!-- 'type="checkbox"': Permite al usuario marcar o desmarcar la opción individualmente. - 'name="Java"': Nombre de la 
variable asociada a esta opción en el servidor. -->
<input type="checkbox" name="Java">Java <br> <!-- Casilla de verificación para Python -->
<input type="checkbox" name="Python"> Python <br> <!-- Casilla de verificación para C# -->
<input type="checkbox" name="C#">C# <br> <!-- Casilla de verificación para Flutter -->
<input type="checkbox" name="Flutter"> Flutter <br>
</form>
</body>
</html>
